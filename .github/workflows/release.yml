name: Release

# Publishes a GitHub release with prebuilt binaries for Linux, macOS and
# Windows. Three ways to start it, all ending in the same published release:
#
#   1. `./scripts/release.ps1` — reads [workspace.package] version from Cargo.toml,
#      tags v<version> and pushes the tag (the usual way).
#   2. Actions → Release → Run workflow, enter a tag such as `v0.2.0`.
#      The tag is created on the commit the run was started from.
#   3. `git tag v0.2.0 && git push origin v0.2.0`.
#
# The tag must match [workspace.package] version (checked on the three
# shipped crates: gaviero-tui, gaviero-cli, gaviero-mcp-shim) so `--version`
# agrees with the release name. A tag with a `-` suffix (`v0.2.0-rc.1`) is
# published as a pre-release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.2.0"
        required: true
        type: string
      draft:
        description: "Create the release as a draft instead of publishing it"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # ort's build script downloads prebuilt ONNX Runtime binaries; keep them
  # inside the workspace so Swatinem/rust-cache picks them up.
  ORT_CACHE_DIR: ${{ github.workspace }}/.ort-cache
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Fails fast, before three platform builds, on a malformed tag, a tag that
  # disagrees with the crate versions, or (manual runs) a tag that already
  # exists — that release would point at a different commit than the one
  # built here.
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vMAJOR.MINOR.PATCH[-PRE]"
            exit 1
          fi
          version="${TAG#v}"
          # cargo metadata resolves `version.workspace = true`.
          metadata=$(cargo metadata --no-deps --format-version 1)
          for crate in gaviero-tui gaviero-cli gaviero-mcp-shim; do
            have=$(jq -r --arg n "$crate" '.packages[] | select(.name == $n) | .version' <<< "$metadata")
            if [[ "$have" != "$version" ]]; then
              echo "::error file=Cargo.toml::$crate is version $have but the tag is $TAG. Bump [workspace.package] version (and Cargo.lock) first."
              exit 1
            fi
          done
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] \
             && git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists. Pick a new version, or delete the tag and its release first."
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Not 22.04: ort's prebuilt static onnxruntime references the C23
          # `__isoc23_strto*` symbols, which first shipped in glibc 2.38, so
          # it cannot link against 22.04's glibc 2.35. 24.04 (glibc 2.39)
          # sets the floor for the shipped binary: Ubuntu 24.04+, Debian 13+,
          # Fedora 40+.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            # macos-14 was retired on 2026-11-02. macos-15 is arm64 too.
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # The three binaries must ship side by side: gaviero finds
      # gaviero-cli (agent hooks) and gaviero-mcp-shim (MCP bridge) next to
      # its own executable.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p gaviero-tui -p gaviero-cli -p gaviero-mcp-shim

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="gaviero-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          for bin in gaviero gaviero-cli gaviero-mcp-shim; do
            cp "target/${{ matrix.target }}/release/${bin}${ext}" "dist/$name/"
          done
          cp LICENSE README.md "dist/$name/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            tar -czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          rm -rf "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: gaviero-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # On a manual run the tag does not exist yet: the release API creates
      # it on `target_commitish`, the commit this run built. A tag created
      # with GITHUB_TOKEN does not trigger the `push: tags` event, so the
      # workflow does not run a second time.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: gaviero ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ contains(env.TAG, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
