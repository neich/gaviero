[package]
name = "gaviero-tui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gaviero"
path = "src/main.rs"

[dependencies]
gaviero-core = { path = "../gaviero-core" }
gaviero-dsl = { path = "../gaviero-dsl" }
# Remote-control wire DTOs + WSS sidecar server (Plan A). The `server`
# feature pulls axum/rustls; the TUI hosts the sidecar in-process.
gaviero-remote = { path = "../gaviero-remote", features = ["server"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
clap = { workspace = true }
ratatui = "0.30"
# "bracketed-paste" and "events" are default features — no explicit list needed.
crossterm = "0.29"
ropey = "1.6"
arboard = { version = "3", features = ["wayland-data-control"] }
base64 = "0.22"
png = "0.17"
notify = "7"
toml = "0.8"
streaming-iterator = "0.1"
# Terminal emulation (M4)
portable-pty = "0.9"
vt100 = "0.16"
unicode-width = "0.2"
# `/remote` pairing QR rendered into the chat panel (Plan A A6).
qrcode = { version = "0.14", default-features = false }

[target.'cfg(windows)'.dependencies]
# SetConsoleCtrlHandler for the Ctrl+C/Ctrl+Break → key-event forwarder
# (platform::install_console_ctrl_forwarder). 0.59 is already in-tree.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    # GetAsyncKeyState for the Ctrl+V image-paste fallback when Windows
    # Terminal swallows the chord and emits no bracketed-paste / key burst.
    "Win32_UI_Input_KeyboardAndMouse",
    # MessageBeep for agent notification sounds (notify::play_system_sound) —
    # BEL is unreliable behind ConPTY + a multiplexer. win32metadata files the
    # function under Diagnostics_Debug; its MB_* argument type lives in
    # WindowsAndMessaging, so both features are required.
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
# A6 tests: self-signed certs for the availability matrix.
rcgen = "0.13"

[build-dependencies]
embed-manifest = "1.4"
