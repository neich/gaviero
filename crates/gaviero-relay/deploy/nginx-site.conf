# gaviero-relay site (inside http {}): port 80 + the relay's own HTTPS.
# TEMPLATE: after copying, put your relay's name in the two server_name lines
# and the two ssl_certificate paths (README step 4c shows the edits).
# Install: /etc/nginx/sites-available/gaviero-relay, linked from
# sites-enabled/ — AFTER the certificate exists (nginx refuses to load a
# missing ssl_certificate). The first certificate is issued before this file
# is enabled; renewals then go through the port-80 block below.

# Port 80: certbot HTTP-01 (nginx mode adds its challenge location here) and
# a redirect for everything else.
server {
    listen 80;
    listen [::]:80;
    server_name gaviero.example.com;
    return 301 https://$host$request_uri;
}

# The relay's HTTPS. NOT on 443: port 443 belongs to the stream block
# (nginx-stream.conf), because phone sessions on 443 must reach the gaviero
# machine undecrypted. The stream block peeks at the SNI only and forwards
# this name — like every other HTTPS site on this nginx — to the shared
# internal loopback port 8443, where nginx picks the server by server_name.
# It sends a PROXY v1 line first, which carries the client IP.
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name gaviero.example.com;
    # No `http2 on;` here: nginx doesn't carry WebSockets over HTTP/2, and
    # the Gaviero Remote app speaks HTTP/1.1. Other sites on :8443 may use
    # `http2 on;` (per server) — but never the old `listen … http2` flag,
    # which would switch the whole shared port, this server included.

    ssl_certificate     /etc/letsencrypt/live/gaviero.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gaviero.example.com/privkey.pem;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    location / {
        proxy_pass http://127.0.0.1:7080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;            # the phone stream is NDJSON, live
        proxy_request_buffering off;
        gzip off;                       # a gzip window holds small NDJSON lines
        proxy_read_timeout 10m;         # control pings every 25 s
        proxy_send_timeout 10m;
    }
}
