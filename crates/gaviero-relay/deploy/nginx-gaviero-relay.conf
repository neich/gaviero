# nginx in front of gaviero-relay — ONE name, ONE port: gaviero.wuilder.com:443.
#
# Requires the stream module with ssl_preread and the http realip module:
#   nginx -V 2>&1 | grep -o 'with-stream\|stream_ssl_preread\|http_realip'
# Debian/Ubuntu: apt install libnginx-mod-stream (if `stream` is missing).
#
# 1. The `stream` block must be at TOP LEVEL of nginx.conf (outside http {}),
#    e.g. `include /etc/nginx/stream.d/*.conf;` next to `events {}`.
# 2. Nothing else may `listen 443` on this IP — every HTTPS site becomes an
#    entry in the map below that points at its own loopback https listener.
# 3. Validate with `sudo nginx -t` before reloading. (Not run by the author:
#    the directives were checked against nginx.org docs only.)

# ---- top level (stream) ------------------------------------------------
stream {
    map $ssl_preread_server_name $gaviero_upstream {
        gaviero.wuilder.com  127.0.0.1:8444;   # the relay's own HTTPS (below)
        default              127.0.0.1:7443;   # everything else: phone TLS → splice port
    }
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $gaviero_upstream;
        proxy_protocol on;          # both upstreams receive a PROXY v1 line
        proxy_connect_timeout 5s;
        proxy_timeout 10m;          # spliced sessions ping every 20 s
    }
}

# ---- inside http { } ---------------------------------------------------
server {
    listen 127.0.0.1:8444 ssl proxy_protocol;
    server_name gaviero.wuilder.com;
    # No http2: nginx doesn't carry WebSockets over HTTP/2, and the
    # Gaviero Remote app speaks HTTP/1.1.

    ssl_certificate     /etc/letsencrypt/live/gaviero.wuilder.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gaviero.wuilder.com/privkey.pem;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    location / {
        proxy_pass http://127.0.0.1:7080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;            # the phone stream is NDJSON, live
        proxy_request_buffering off;
        proxy_read_timeout 10m;         # control pings every 25 s
        proxy_send_timeout 10m;
    }
}

# Port 80 (certbot HTTP-01 in nginx mode + redirect), inside http { }:
server {
    listen 80;
    listen [::]:80;
    server_name gaviero.wuilder.com;
    return 301 https://$host$request_uri;
}
