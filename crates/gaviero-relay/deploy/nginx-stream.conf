# gaviero-relay, part 1 of 3: SNI routing on :443 (TOP LEVEL, outside http {}).
# Install: /etc/nginx/streams-available/gaviero-relay, linked from
# streams-enabled/, which nginx.conf includes at TOP LEVEL
# (`include /etc/nginx/streams-enabled/*;` — never from sites-enabled, which
# is inside http {}). See crates/gaviero-relay/README.md, step 4d.
#
# Needs the stream module with ssl_preread:
#   nginx -V 2>&1 | grep -o 'with-stream[^ ]*\|stream_ssl_preread'
# Debian/Ubuntu: apt install libnginx-mod-stream (if `stream` is missing).
#
# Once this block owns :443, NOTHING ELSE may `listen 443` on this host:
# every other HTTPS site moves to its own loopback listener and gets a line
# in the map below (README, "Other HTTPS sites on the same nginx").

stream {
    map $ssl_preread_server_name $gaviero_upstream {
        gaviero.wuilder.com  127.0.0.1:8444;   # the relay's own HTTPS (nginx-site.conf)
        # ntfy.wuilder.com   127.0.0.1:8445;   # example: another HTTPS site moved to loopback
        default              127.0.0.1:7443;   # everything else: phone TLS → relay splice port
    }
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $gaviero_upstream;
        proxy_protocol on;          # every upstream receives a PROXY v1 line
        proxy_connect_timeout 5s;
        proxy_timeout 10m;          # spliced sessions ping every 20 s
    }
}
