# gaviero-relay: SNI routing on :443 (TOP LEVEL, outside http {}).
# TEMPLATE: after copying, put your relay's name in the first two map entries
# (README step 4d shows the edits).
# Install: /etc/nginx/streams-available/gaviero-relay, linked from
# streams-enabled/, which nginx.conf includes at TOP LEVEL
# (`include /etc/nginx/streams-enabled/*;` — never from sites-enabled, which
# is inside http {}). See crates/gaviero-relay/README.md, step 4d.
#
# Needs the stream module with ssl_preread, LOADED (Debian/Ubuntu:
# libnginx-mod-stream → modules-enabled/50-mod-stream.conf). Otherwise
# `nginx -t` says: unknown directive "stream".
#
# Once this block owns :443, NOTHING ELSE may `listen 443` on this host.
# Every HTTPS site — the relay's own and all your others — listens on the
# shared loopback port 127.0.0.1:8443 instead (README, "Other HTTPS sites on
# the same nginx"); nginx picks the site by server_name there as usual, so
# adding a site never needs a change here.

# No ssl_certificate here, on purpose: this block never terminates TLS.
# ssl_preread only reads the server name from the (cleartext) ClientHello;
# the bytes are forwarded still encrypted. Your sites' certificates are used
# by their own servers on :8443; phone sessions to route names are decrypted
# only by the gaviero machine (its own pinned CA).

stream {
    map $ssl_preread_server_name $gaviero_upstream {
        hostnames;
        # 8443 twice ON PURPOSE: the exact entry pins the relay's own name to
        # the shared HTTPS listener even if the mask below were to match the
        # bare name (an exact name always wins over a mask). Remove it and
        # the bare name falls to `default`, which is the same port anyway.
        gaviero.example.com    127.0.0.1:8443;   # the relay's own HTTPS (nginx-site.conf)
        *.gaviero.example.com  127.0.0.1:7443;   # route names: phone TLS → relay splice port (--splice)
        default                127.0.0.1:8443;   # every other name: all your HTTPS sites
    }
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $gaviero_upstream;
        proxy_protocol on;          # every upstream receives a PROXY v1 line
        proxy_connect_timeout 5s;
        proxy_timeout 10m;          # spliced sessions ping every 20 s
    }
}
