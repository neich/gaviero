# gaviero-relay, part 2 of 3: port 80 (inside http {}).
# Install: /etc/nginx/sites-available/gaviero-relay-http, linked from
# sites-enabled/ — BEFORE requesting the
# certificate: certbot's nginx mode answers the HTTP-01 challenge through
# this server block, and renewals keep using it.

server {
    listen 80;
    listen [::]:80;
    server_name gaviero.wuilder.com;
    return 301 https://$host$request_uri;
}
