# gaviero-relay, part 3 of 3: the relay's own HTTPS (inside http {}).
# Install: /etc/nginx/sites-available/gaviero-relay-https, linked from
# sites-enabled/ — AFTER the certificate
# exists (nginx refuses to load a missing ssl_certificate).
#
# Reached only through the stream map (nginx-stream.conf) on loopback, so
# it receives a PROXY v1 line first and takes the client IP from it.

server {
    listen 127.0.0.1:8444 ssl proxy_protocol;
    server_name gaviero.wuilder.com;
    # No http2: nginx doesn't carry WebSockets over HTTP/2, and the
    # Gaviero Remote app speaks HTTP/1.1.

    ssl_certificate     /etc/letsencrypt/live/gaviero.wuilder.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gaviero.wuilder.com/privkey.pem;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    location / {
        proxy_pass http://127.0.0.1:7080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;            # the phone stream is NDJSON, live
        proxy_request_buffering off;
        proxy_read_timeout 10m;         # control pings every 25 s
        proxy_send_timeout 10m;
    }
}
